
[build]
  base = "frontend"
  command = "cd ../backend && npm install && cd ../frontend && npm install && npm run build"
  publish = "build"

[functions]
  directory = "../backend/netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = [
    "express",
    "cors",
    "serverless-http",
    "mongoose",
    "cloudinary",
    "jsonwebtoken",
    "bcrypt"
    "socket.io"
    "multer"
  ]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true
